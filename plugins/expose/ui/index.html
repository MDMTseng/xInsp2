<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>expose · live output</title>
<!--
  expose plugin webUI — a fully self-contained consumer of this plugin's own
  wire contract. Owns its UI: nothing in core / extension / ui-components carries
  any expose-specific code. The only thing it borrows from the host is the
  generic plugin-UI transport (the VS Code webview bridge, exactly like the
  sibling plugins record_save / mock_camera / json_source / blob_analysis), and
  — when opened standalone against a raw backend socket — the generic
  `exchange_instance` command + binary passthrough.

  THE WIRE CONTRACT (mirrored from plugins/expose/src/expose.cpp):
    * Binary push frame: ASCII magic 'XEX1' then a minimal msgpack map
        { v:1, channel:<str>, seq:<uint>, json:<str>, images:[ {key, jpeg:<bin>} ] }
      `json` is the record's values as a JSON string (in record key order).
    * Pull / control over the plugin exchange:
        { command:"list_channels" } -> { count, channels:{ name:{seen,image_count,subscribed} } }
        { command:"subscribe"|"unsubscribe", channels:[...] } -> { ok, subscribed:[...] }
        { command:"get", channel } -> { found, channel, seq, frame_b64 }   (base64 of the SAME XEX1 frame)

  Two transports, one decoder:
    A. VS Code webview bridge (default when hosted by the extension): post
       { type:'exchange', cmd } and the bridge replies with { type:'status', ...data }.
       The bridge does NOT forward binary push frames, so liveness here comes from
       polling list_channels + get (we decode the base64 XEX1 frame the same way).
    B. Direct WebSocket (?ws= / ?port=, e.g. the HMI or a test harness): we get
       the real binary push live AND can pull via exchange_instance.
-->
<style>
  :root {
    --bg:     var(--vscode-sideBar-background, #16181d);
    --panel:  var(--vscode-editor-background, #1e2128);
    --border: var(--vscode-widget-border, #2c313c);
    --fg:     var(--vscode-foreground, #d7dae0);
    --muted:  var(--vscode-descriptionForeground, #8b93a3);
    --accent: var(--vscode-focusBorder, #5aa9ff);
    --val:    #e6c07b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 var(--vscode-font-family, -apple-system, Segoe UI, Roboto, sans-serif);
         background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header h1 small { color: var(--muted); font-weight: 400; }
  .pill { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.ok { color: #5fd08a; }
  #status.err { color: #f44336; }

  #tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px 0; }
  .tab { padding: 6px 14px; border: 1px solid var(--border); border-bottom: none; border-radius: 7px 7px 0 0;
         background: var(--panel); color: var(--muted); cursor: pointer; font-weight: 500; }
  .tab.active { color: var(--fg); border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab .n { color: var(--muted); font-size: 11px; }
  .tab.unsub { opacity: 0.6; }

  #panel { margin: 0 18px 18px; border: 1px solid var(--border); border-radius: 0 9px 9px 9px; background: var(--panel); padding: 14px; }
  .empty { color: var(--muted); font-style: italic; padding: 24px 8px; text-align: center; }

  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px;
                   color: var(--muted); margin: 4px 0 8px; }
  table.vals { width: 100%; border-collapse: collapse; font-family: var(--vscode-editor-font-family, ui-monospace, monospace); }
  table.vals td { padding: 5px 8px; border-bottom: 1px solid #23262e; vertical-align: top; }
  table.vals tr:last-child td { border-bottom: none; }
  table.vals td.k { width: 200px; color: var(--muted); word-break: break-all; }
  table.vals td.v { color: var(--val); white-space: pre-wrap; word-break: break-word; }
  table.vals td.v.special { color: #d19a66; font-style: italic; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; }
  .imgcard { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #000; }
  .imgcard .cap { font-family: var(--vscode-editor-font-family, ui-monospace, monospace); font-size: 11px;
                  color: var(--muted); padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--border);
                  word-break: break-all; }
  .imgcard img { display: block; width: 100%; height: auto;
                 background: repeating-conic-gradient(#2a2e37 0% 25%, #23262e 0% 50%) 50% / 16px 16px; }
</style>
</head>
<body>
<header>
  <h1>expose <small>· live output</small></h1>
  <span class="pill" id="frames">frames: 0</span>
  <span id="status">connecting…</span>
</header>
<div id="tabs"></div>
<div id="panel"><div class="empty">No channels yet — run a script that calls xi::expose::send(...).</div></div>

<script>
(function () {
  "use strict";

  // ---- per-channel UI state ------------------------------------------------
  // name -> { seen, image_count, subscribed, seq, values:{...}, images:{ key:dataUrl } }
  const channels = {};
  let active = null;
  let frameCount = 0;
  const subscribed = new Set();   // channels WE asked to subscribe (for unsubscribe-on-unload)

  const statusEl = document.getElementById("status");
  const setStatus = (t, cls) => { statusEl.textContent = t; statusEl.className = cls || ""; };

  // ======================================================================
  //  Self-contained XEX1 decoder (magic gate + minimal msgpack reader).
  //  Implements only the subset the producer emits, per the documented wire
  //  contract. Multi-byte ints are big-endian. No external dependency.
  //
  //  The region between the XEX1-DECODER markers below is extracted verbatim
  //  and cross-tested against the C++ encoder's golden frames by
  //  ui-components/test/xex1-golden.mjs — keep it self-contained (no DOM refs)
  //  so that test keeps decoding the exact bytes this webUI does.
  // ======================================================================
  // <XEX1-DECODER>
  function MsgpackReader(bytes, off) {
    this.b = bytes;
    this.o = off || 0;
    this.dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  }
  MsgpackReader.prototype.u8  = function () { return this.b[this.o++]; };
  MsgpackReader.prototype.u16 = function () { const v = this.dv.getUint16(this.o, false); this.o += 2; return v; };
  MsgpackReader.prototype.u32 = function () { const v = this.dv.getUint32(this.o, false); this.o += 4; return v; };
  MsgpackReader.prototype.u64 = function () {
    const hi = this.dv.getUint32(this.o, false), lo = this.dv.getUint32(this.o + 4, false);
    this.o += 8; return hi * 4294967296 + lo;   // safe for our small seq values
  };
  MsgpackReader.prototype.str = function (n) {
    const s = new TextDecoder().decode(this.b.subarray(this.o, this.o + n)); this.o += n; return s;
  };
  MsgpackReader.prototype.bin = function (n) {
    const v = this.b.subarray(this.o, this.o + n); this.o += n; return v;   // Uint8Array view
  };
  MsgpackReader.prototype.i8  = function () { const v = this.dv.getInt8(this.o); this.o += 1; return v; };
  MsgpackReader.prototype.i16 = function () { const v = this.dv.getInt16(this.o, false); this.o += 2; return v; };
  MsgpackReader.prototype.i32 = function () { const v = this.dv.getInt32(this.o, false); this.o += 4; return v; };
  MsgpackReader.prototype.i64 = function () {
    const hi = this.dv.getInt32(this.o, false), lo = this.dv.getUint32(this.o + 4, false);
    this.o += 8; return hi * 4294967296 + lo;   // exact for our |v| < 2^53 (seq/dims)
  };
  MsgpackReader.prototype.f32 = function () { const v = this.dv.getFloat32(this.o, false); this.o += 4; return v; };
  MsgpackReader.prototype.f64 = function () { const v = this.dv.getFloat64(this.o, false); this.o += 8; return v; };
  MsgpackReader.prototype.arr = function (n) { const a = new Array(n); for (let i = 0; i < n; i++) a[i] = this.read(); return a; };
  MsgpackReader.prototype.map = function (n) { const m = {}; for (let i = 0; i < n; i++) { const k = this.read(); m[k] = this.read(); } return m; };
  MsgpackReader.prototype.read = function () {
    const c = this.u8();
    if (c <= 0x7f) return c;                              // positive fixint
    if (c >= 0xe0) return c - 0x100;                      // negative fixint
    if (c >= 0x80 && c <= 0x8f) return this.map(c & 0x0f); // fixmap
    if (c >= 0x90 && c <= 0x9f) return this.arr(c & 0x0f); // fixarray
    if (c >= 0xa0 && c <= 0xbf) return this.str(c & 0x1f); // fixstr
    switch (c) {
      case 0xc0: return null;
      case 0xc2: return false;
      case 0xc3: return true;
      case 0xc4: return this.bin(this.u8());
      case 0xc5: return this.bin(this.u16());
      case 0xc6: return this.bin(this.u32());
      case 0xca: return this.f32();
      case 0xcb: return this.f64();              // canonical float64 (pack plane)
      case 0xcc: return this.u8();
      case 0xcd: return this.u16();
      case 0xce: return this.u32();
      case 0xcf: return this.u64();
      case 0xd0: return this.i8();
      case 0xd1: return this.i16();
      case 0xd2: return this.i32();
      case 0xd3: return this.i64();              // canonical int64 (pack plane)
      case 0xd9: return this.str(this.u8());
      case 0xda: return this.str(this.u16());
      case 0xdb: return this.str(this.u32());
      case 0xdc: return this.arr(this.u16());
      case 0xdd: return this.arr(this.u32());
      case 0xde: return this.map(this.u16());   // map16 — a frame with >15 top-level keys
      case 0xdf: return this.map(this.u32());   // map32
      default: throw new Error("unsupported msgpack byte 0x" + c.toString(16));
    }
  };

  // Normalize an XEX1-v3 canonical frame dump { v:3, channel, seq, frame:{...} }
  // into the same shape the UI renders. v3 (the finalized dump) carries every
  // entry as a [tag, value] pair — tag is the pack-plane XI_PACK_TAG_* — so an
  // entry's type is identified by ITS TAG, never by shape: tag 8 (BLOB, spec 30)
  // -> blobs[] (+ images[] for xi/image blobs, rasterized lossless); every other
  // tag -> values (a bin entry surfaces as a Uint8Array value). The retired
  // IMAGE(4)/TENSOR(7) tags are permanent gaps.
  //
  // A BLOB value is EITHER the entire self-describing buffer verbatim (a
  // Uint8Array — record_save/disk + the non-preview WS path) OR, on expose's
  // WS-SEND path for an xi/image blob, a map { desc:<bin>, preview:{enc:"jpeg",
  // q, data:<jpeg bin>} } — a full-resolution compressed substitution (never
  // persisted). The FE reads dims/type from the descriptor either way.
  const XEX1_TAG_BLOB = 8;

  // Validate + split a self-describing blob buffer (spec 30) into { t, desc,
  // descBytes, payload }. Throws on a bad head — the fail-loud discipline the
  // C++ blob_head_validate seam enforces at ingress.
  function parseBlobBuffer(buf) {
    if (!(buf instanceof Uint8Array) || buf.length < 8) throw new Error("blob too short");
    // magic 'XBD1' (bytes X,B,D,1)
    if (buf[0] !== 0x58 || buf[1] !== 0x42 || buf[2] !== 0x44 || buf[3] !== 0x31) throw new Error("bad blob magic");
    const descLen = (buf[4] | (buf[5] << 8) | (buf[6] << 16) | (buf[7] << 24)) >>> 0;  // u32 LE
    if (8 + descLen > buf.length) throw new Error("blob desc_len overrun");
    const payloadOff = (8 + descLen + 63) & ~63;                                       // align_up(8+desc_len, 64)
    if (payloadOff > buf.length) throw new Error("blob payload_off out of range");
    const descBytes = buf.subarray(8, 8 + descLen);
    const desc = new MsgpackReader(descBytes, 0).read();
    if (!desc || typeof desc !== "object") throw new Error("blob descriptor is not a map");
    return { t: desc.t, desc, descBytes, payload: buf.subarray(payloadOff) };
  }

  function normalizeXEX1v3(body) {
    const frame = (body && body.frame) || {};
    const values = {}, images = [], blobs = [];
    for (const k in frame) {
      const e = frame[k];
      if (!Array.isArray(e) || e.length !== 2) continue;   // not a [tag, value] pair
      const tag = e[0], v = e[1];
      if (tag !== XEX1_TAG_BLOB) { values[k] = v; continue; }
      if (v instanceof Uint8Array) {
        // Verbatim buffer (disk / non-preview wire).
        let b;
        try { b = parseBlobBuffer(v); } catch (err) { console.warn("XEX1 bad blob", k, err); continue; }
        blobs.push({ key: k, t: b.t, descBytes: b.descBytes, payload: b.payload, desc: b.desc });
        if (b.t === "xi/image" && b.desc)
          images.push({ key: k, t: "xi/image", w: b.desc.w, h: b.desc.h, c: b.desc.c,
                        dt: b.desc.dt, pixels: b.payload });
      } else if (v && typeof v === "object" && v.preview && typeof v.preview === "object") {
        // WS-SEND preview arm: { desc:<bin>, preview:{enc,q,data} }.
        let desc = {};
        if (v.desc instanceof Uint8Array && v.desc.length) {
          try { const dv = new MsgpackReader(v.desc, 0).read(); if (dv && typeof dv === "object") desc = dv; }
          catch (err) { /* leave desc empty */ }
        }
        const im = { key: k, t: desc.t, w: desc.w, h: desc.h, c: desc.c, dt: desc.dt };
        if (v.preview.data instanceof Uint8Array)
          im.preview = { enc: v.preview.enc, q: v.preview.q, data: v.preview.data };
        images.push(im);
        blobs.push({ key: k, t: desc.t, desc });
      } else {
        values[k] = v;
      }
    }
    return { v: 3, channel: body.channel, seq: body.seq, values, images, blobs, frame };
  }

  // Decode an XEX1 frame. v1 -> the raw map { v:1, channel, seq, json,
  // images:[{key,jpeg}] }; v3 -> the normalized canonical dump (values+images).
  // null on bad magic / unreadable body.
  function decodeXEX1(bytes) {
    if (!bytes || bytes.length < 5) return null;
    if (bytes[0] !== 0x58 || bytes[1] !== 0x45 || bytes[2] !== 0x58 || bytes[3] !== 0x31) return null; // 'XEX1'
    let body;
    try { body = new MsgpackReader(bytes, 4).read(); }
    catch (e) { console.warn("XEX1 decode failed", e); return null; }
    if (body && body.v === 3) return normalizeXEX1v3(body);
    return body;
  }

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(u8) {
    let s = "";
    const CH = 0x8000;
    for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return btoa(s);
  }

  // Restore the non-finite sentinels the producer emits as JSON strings
  // ("NaN" / "Infinity" / "-Infinity") back to real numbers, recursively.
  function restoreNonFinite(v) {
    if (typeof v === "string") {
      if (v === "NaN") return NaN;
      if (v === "Infinity") return Infinity;
      if (v === "-Infinity") return -Infinity;
      return v;
    }
    if (Array.isArray(v)) return v.map(restoreNonFinite);
    if (v && typeof v === "object") { const o = {}; for (const k in v) o[k] = restoreNonFinite(v[k]); return o; }
    return v;
  }
  // </XEX1-DECODER>

  // ======================================================================
  //  Frame / channel-list handling (transport-agnostic)
  // ======================================================================
  function ensureChannel(name) {
    if (!channels[name]) channels[name] = { seen: 0, image_count: 0, subscribed: false, seq: 0, values: {}, images: {} };
    if (active === null) active = name;
    return channels[name];
  }

  // Raw v3 pixels (gray/RGB/RGBA) -> a data URL, painted through a canvas. The
  // lossless v3 wire carries raw planes; when no compressed preview rides along
  // we rasterize them here so the same UI renders both wire shapes.
  function rawPixelsToDataUrl(w, h, c, px) {
    if (!w || !h || !c || !(px instanceof Uint8Array) || px.length < w * h * c) return null;
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let i = 0, n = w * h; i < n; i++) {
      const s = i * c, o = i * 4;
      if (c === 1) { d[o] = d[o + 1] = d[o + 2] = px[s]; d[o + 3] = 255; }
      else if (c === 3) { d[o] = px[s]; d[o + 1] = px[s + 1]; d[o + 2] = px[s + 2]; d[o + 3] = 255; }
      else { d[o] = px[s]; d[o + 1] = px[s + 1]; d[o + 2] = px[s + 2]; d[o + 3] = px[s + 3]; }
    }
    ctx.putImageData(img, 0, 0);
    return cv.toDataURL("image/png");
  }

  function onFrame(frame) {
    if (!frame || typeof frame.channel !== "string") return;
    const st = ensureChannel(frame.channel);
    st.seq = frame.seq;
    const isV3 = frame.v === 3;
    // v3 carries values as a decoded object; v1 carries a JSON string.
    let values = {};
    if (isV3 && frame.values && typeof frame.values === "object") {
      values = restoreNonFinite(frame.values);
    } else {
      try { values = restoreNonFinite(JSON.parse(frame.json || "{}")); } catch (e) { values = {}; }
    }
    st.values = values;
    st.images = {};
    for (const im of (frame.images || [])) {
      if (!im || typeof im.key !== "string") continue;
      if (im.jpeg) {                                   // v1: JPEG display frame
        st.images[im.key] = "data:image/jpeg;base64," + bytesToB64(im.jpeg);
      } else if (im.preview && im.preview.data && (im.preview.enc || "jpeg") === "jpeg") {
        // E2: full-resolution compressed preview — decode the JPEG bin directly.
        st.images[im.key] = "data:image/jpeg;base64," + bytesToB64(im.preview.data);
      } else if (im.pixels && im.pixels.length) {      // v3 lossless: rasterize raw planes
        const url = rawPixelsToDataUrl(im.w, im.h, im.c, im.pixels);
        if (url) st.images[im.key] = url;
      }
    }
    st.image_count = Object.keys(st.images).length;
    frameCount++;
    document.getElementById("frames").textContent = "frames: " + frameCount;
    render();
  }

  function onChannelList(list) {
    // list: { name: { seen, image_count, subscribed } }
    for (const name of Object.keys(list)) {
      const st = ensureChannel(name);
      const meta = list[name] || {};
      if (typeof meta.seen === "number") st.seen = meta.seen;
      if (typeof meta.image_count === "number" && !Object.keys(st.images).length) st.image_count = meta.image_count;
      st.subscribed = !!meta.subscribed;
      // Subscribe to (and snapshot) any channel we aren't watching yet.
      if (!subscribed.has(name)) {
        subscribed.add(name);
        exchange({ command: "subscribe", channels: [name] });
      }
      exchange({ command: "get", channel: name });   // snapshot / liveness (webview has no binary push)
    }
    render();
  }

  // Branch a returned exchange-data object onto the right handler by shape.
  function handleExchangeData(d) {
    if (!d || typeof d !== "object") return;
    if (d.channels && typeof d.channels === "object" && !Array.isArray(d.channels)) {
      onChannelList(d.channels);                        // list_channels
    } else if (typeof d.frame_b64 === "string" && d.frame_b64) {
      onFrame(decodeXEX1(b64ToBytes(d.frame_b64)));     // get (found)
    }
    // subscribe/unsubscribe acks ({ ok, subscribed }) and get-misses ({ found:false }) need no action.
  }

  // ======================================================================
  //  Transport selection: VS Code webview bridge  OR  direct WebSocket
  // ======================================================================
  const vscode = (typeof acquireVsCodeApi === "function") ? acquireVsCodeApi() : null;
  let exchange;   // (cmd) => void

  if (vscode) {
    // --- A. VS Code webview bridge (matches the sibling plugin UIs) --------
    exchange = function (cmd) { vscode.postMessage({ type: "exchange", cmd: cmd }); };
    window.addEventListener("message", (e) => {
      const m = e.data;
      if (m && m.type === "status") handleExchangeData(m);   // bridge spreads exchange reply into a status msg
    });
    setStatus("connected (webview)", "ok");
    poll();
    setInterval(poll, 1000);   // no binary push over the bridge -> poll list+get for liveness
  } else {
    // --- B. Direct WebSocket (standalone / HMI / test harness) -------------
    const P = new URLSearchParams(location.search);
    const INSTANCE = P.get("instance") || "expose";
    const url = P.get("ws") || ("ws://127.0.0.1:" + (P.get("port") || "7823") + "/");
    const ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";
    let id = 100;
    exchange = function (cmd) {
      try { ws.send(JSON.stringify({ type: "cmd", id: id++, name: "exchange_instance", args: { name: INSTANCE, cmd: cmd } })); }
      catch (e) { /* socket not open */ }
    };
    ws.onopen = () => { setStatus("connected " + url, "ok"); poll(); setInterval(poll, 1000); };
    ws.onclose = () => setStatus("disconnected", "err");
    ws.onerror = () => setStatus("connection error", "err");
    ws.onmessage = (ev) => {
      if (typeof ev.data !== "string") { onFrame(decodeXEX1(new Uint8Array(ev.data))); return; }  // live binary push
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "rsp" && m.ok) handleExchangeData(typeof m.data === "string" ? safeParse(m.data) : m.data);
    };
  }

  function safeParse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  function poll() { exchange({ command: "list_channels" }); }

  // Best-effort unsubscribe when the panel goes away.
  function teardown() {
    if (!subscribed.size) return;
    exchange({ command: "unsubscribe", channels: Array.from(subscribed) });
    subscribed.clear();
  }
  window.addEventListener("pagehide", teardown);
  window.addEventListener("beforeunload", teardown);

  // ======================================================================
  //  Render
  // ======================================================================
  function fmtVal(v) {
    if (v === null) return { text: "null", special: true };
    if (typeof v === "number") {
      if (Number.isNaN(v)) return { text: "NaN", special: true };
      if (v === Infinity) return { text: "Infinity", special: true };
      if (v === -Infinity) return { text: "-Infinity", special: true };
      return { text: String(v), special: false };
    }
    if (typeof v === "boolean") return { text: String(v), special: true };
    if (typeof v === "string") return { text: v, special: false };
    try { return { text: JSON.stringify(v), special: false }; } catch (e) { return { text: String(v), special: false }; }
  }

  function render() {
    // tabs
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    const names = Object.keys(channels);
    for (const name of names) {
      const st = channels[name];
      const t = document.createElement("div");
      t.className = "tab" + (name === active ? " active" : "") + (st.subscribed ? "" : " unsub");
      const nImg = Object.keys(st.images).length || st.image_count || 0;
      t.innerHTML = escapeHtml(name) + ' <span class="n">#' + (st.seq || 0) + " · " + nImg + " img</span>";
      t.onclick = () => { active = name; render(); };
      tabs.appendChild(t);
    }

    // panel
    const panel = document.getElementById("panel");
    panel.innerHTML = "";
    const st = active && channels[active];
    if (!st) { panel.innerHTML = '<div class="empty">No channels yet — run a script that calls xi::expose::send(...).</div>'; return; }

    // values table (in json key order)
    const vt = document.createElement("div");
    vt.className = "section-title";
    vt.textContent = "Values · seq " + (st.seq || 0);
    panel.appendChild(vt);
    const keys = Object.keys(st.values);
    if (keys.length) {
      const table = document.createElement("table");
      table.className = "vals";
      for (const k of keys) {
        const tr = document.createElement("tr");
        const kd = document.createElement("td"); kd.className = "k"; kd.textContent = k;
        const f = fmtVal(st.values[k]);
        const vd = document.createElement("td"); vd.className = "v" + (f.special ? " special" : ""); vd.textContent = f.text;
        tr.appendChild(kd); tr.appendChild(vd);
        table.appendChild(tr);
      }
      panel.appendChild(table);
    } else {
      const e = document.createElement("div"); e.className = "empty"; e.textContent = "(no values)"; panel.appendChild(e);
    }

    // image grid (by key)
    const imgKeys = Object.keys(st.images);
    if (imgKeys.length) {
      const it = document.createElement("div"); it.className = "section-title"; it.textContent = "Images"; it.style.marginTop = "16px";
      panel.appendChild(it);
      const grid = document.createElement("div"); grid.className = "grid";
      for (const key of imgKeys) {
        const card = document.createElement("div"); card.className = "imgcard";
        const cap = document.createElement("div"); cap.className = "cap"; cap.textContent = key;
        const img = document.createElement("img"); img.src = st.images[key]; img.alt = key;
        card.appendChild(cap); card.appendChild(img); grid.appendChild(card);
      }
      panel.appendChild(grid);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
})();
</script>
</body>
</html>
