<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { font-family: var(--vscode-font-family, system-ui); color: var(--vscode-foreground, #ccc);
         background: var(--vscode-sideBar-background, #1e1e1e); padding: 14px; font-size: 13px; }
  h2 { margin: 0 0 4px; font-size: 15px; }
  .hint { color: #888; font-size: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  input[type=text] { flex: 1; background: var(--vscode-input-background, #2a2a2a);
                     color: var(--vscode-input-foreground, #ccc);
                     border: 1px solid rgba(255,255,255,0.12); border-radius: 3px; padding: 4px 6px; }
  button { background: var(--vscode-button-background, #0e639c); color: var(--vscode-button-foreground, #fff);
           border: none; padding: 5px 12px; border-radius: 3px; font-size: 12px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 148px); gap: 10px; }
  .cell { cursor: pointer; border: 1px solid rgba(255,255,255,0.08); border-radius: 5px;
          padding: 4px; background: var(--vscode-editor-background); transition: border-color .1s; }
  .cell:hover { border-color: var(--vscode-focusBorder, #0e639c); }
  .cell img { width: 140px; display: block; border-radius: 3px; background:#000; }
  .cap { font-family: monospace; font-size: 11px; color:#aaa; margin-top: 4px; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }
  .empty { color:#888; font-style: italic; padding: 20px 0; }
  .issued { color:#4caf50; font-size:12px; margin-bottom:10px; min-height: 16px; }
</style></head>
<body>
  <h2>Local image source</h2>
  <div class="hint">Pick a folder of images, then click a thumbnail to <b>issue</b> it
    (runs one pipeline pass on that image).</div>
  <div class="row">
    <input type="text" id="dir" data-param="dir" placeholder="C:\path\to\images" />
    <button id="set" data-action="set_dir">Set folder</button>
    <button id="refresh" data-action="refresh" class="secondary">Refresh</button>
  </div>
  <div class="issued" id="issued"></div>
  <div class="grid" id="grid"></div>

  <script>
    const vscode = acquireVsCodeApi();
    const send = (cmd) => vscode.postMessage({ type: 'exchange', cmd });
    const $ = id => document.getElementById(id);

    $('set').onclick     = () => send({ command: 'set_dir', value: $('dir').value });
    $('refresh').onclick = () => send({ command: 'refresh' });

    function render(s) {
      if (typeof s.dir === 'string' && document.activeElement !== $('dir')) $('dir').value = s.dir;
      $('issued').textContent = s.issued_name
        ? `issued: ${s.issued_name}  (${s.issued_count} total)` : '';
      const grid = $('grid');
      grid.innerHTML = '';
      const files = s.files || [];
      if (!files.length) {
        grid.innerHTML = `<div class="empty">${s.dir ? 'no images in folder' : 'set a folder above'}</div>`;
        return;
      }
      files.forEach((f, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.title = `${f.name}  ${f.w}x${f.h}  — click to issue`;
        cell.innerHTML =
          (f.thumb ? `<img src="${f.thumb}">` : `<div class="cap">${f.w}x${f.h}</div>`) +
          `<div class="cap">${f.name}</div>`;
        cell.onclick = () => send({ command: 'issue', index: i });
        grid.appendChild(cell);
      });
    }

    window.addEventListener('message', (e) => {
      const m = e.data;
      if (m && m.type === 'status') render(m);
    });
    send({ command: 'get_status' });
  </script>
</body></html>
